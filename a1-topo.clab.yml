name: a1-topo

topology:
  nodes:
    client1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.11.10/24 dev eth1
        - ip route replace default via 192.168.11.1 dev eth1

    client2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.11.11/24 dev eth1
        - ip route replace default via 192.168.11.1 dev eth1

    client3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.22.10/24 dev eth1
        - ip route replace default via 192.168.22.1 dev eth1

    client4:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.22.11/24 dev eth1
        - ip route replace default via 192.168.22.1 dev eth1

    cabinet1_srl:
      kind: nokia_srlinux
      type: ixs-a1
      image: ghcr.io/nokia/srlinux:latest
      startup-config: configs/cabinetA_config.json

    cabinet2_srl:
      kind: nokia_srlinux
      type: ixs-a1
      image: ghcr.io/nokia/srlinux:latest
      startup-config: configs/cabinetB_config.json

    uplink-sw:
      kind: nokia_srlinux
      type: ixs-a1
      image: ghcr.io/nokia/srlinux:latest
      startup-config: configs/sw_uplink_config.json

  links:
    - endpoints: [ "cabinet1_srl:e1-10", "client1:eth1" ]
    - endpoints: [ "client2:eth1", "cabinet1_srl:e1-11" ]
    - endpoints: [ "cabinet2_srl:e1-10", "client3:eth1" ]
    - endpoints: [ "client4:eth1", "cabinet2_srl:e1-11" ]
    - endpoints: [ "cabinet1_srl:e1-2", "uplink-sw:e1-2" ]
    - endpoints: [ "cabinet1_srl:e1-1", "cabinet2_srl:e1-1" ]
    - endpoints: [ "cabinet2_srl:e1-3", "uplink-sw:e1-3" ]
